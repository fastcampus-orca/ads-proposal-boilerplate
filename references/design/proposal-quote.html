<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제안서 디자인 스타일</title>
<style>
  :root{
    --bg:#f6f3ed;
    --paper:#fffdf9;
    --ink:#1f2420;
    --ink-soft:#4a534c;
    --ink-faint:#7c8880;
    --line:#e7e1d7;
    --line-strong:#cec7b9;
    --accent:#2f6b4f;
    --accent-soft:#edf5ef;
    --pass:#1f7a4d;
    --pass-bg:#e5f5ec;
    --pass-border:#a9dcc0;
    --warn:#a8710a;
    --warn-bg:#fbf1de;
    --warn-border:#e9cf98;
    --table-head:#f0f3ed;
    --table-stripe:#fcfaf5;
    --code-bg:#f1efe8;
    --hero-bg:#eef5f1;
    --hero-border:#dbe7dc;
    --hero-text:#44515a;
    --product-bg:#e7efe6;
    --product-border:#d5e2d7;
    --hero-line:#cbd9dd;
    --hero-stat:#163c32;
    --hero-muted:#66747a;
    --shadow: 0 2px 4px rgba(47,54,42,0.04), 0 16px 40px rgba(47,54,42,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#151815;
      --paper:#1c201c;
      --ink:#eceee9;
      --ink-soft:#b7bdb3;
      --ink-faint:#828a80;
      --line:#33372f;
      --line-strong:#454a3f;
      --accent:#6fbf94;
      --accent-soft:#1e2c23;
      --pass:#7fd3a3;
      --pass-bg:#173226;
      --pass-border:#2c5d42;
      --warn:#e0b459;
      --warn-bg:#332a15;
      --warn-border:#5c4a1f;
      --table-head:#242822;
      --table-stripe:#20241f;
      --code-bg:#242822;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#151815;
    --paper:#1c201c;
    --ink:#eceee9;
    --ink-soft:#b7bdb3;
    --ink-faint:#828a80;
    --line:#33372f;
    --line-strong:#454a3f;
    --accent:#6fbf94;
    --accent-soft:#1e2c23;
    --pass:#7fd3a3;
    --pass-bg:#173226;
    --pass-border:#2c5d42;
    --warn:#e0b459;
    --warn-bg:#332a15;
    --warn-border:#5c4a1f;
    --table-head:#242822;
    --table-stripe:#20241f;
    --code-bg:#242822;
    --hero-bg:#202b24;
    --hero-border:#385243;
    --hero-text:#c2cec5;
    --product-bg:#26352b;
    --product-border:#3c5646;
    --hero-line:#3d5143;
    --hero-stat:#b8dfc4;
    --hero-muted:#a4b5aa;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html{color-scheme:dark;}
  html[data-theme="light"]{color-scheme:light;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.7;
    background-image:radial-gradient(circle at 10% 0%, rgba(82,130,102,.14), transparent 34%), radial-gradient(circle at 94% 12%, rgba(177,132,49,.10), transparent 28%);
    -webkit-font-smoothing:antialiased;
  }
  :root[data-theme="light"] body{
    background-image:radial-gradient(circle at 10% 0%, rgba(231,242,236,.7), transparent 34%), radial-gradient(circle at 94% 12%, rgba(251,241,222,.65), transparent 28%);
  }
  .page{
    max-width:1160px;
    margin:0 auto;
    padding:76px 20px 88px;
  }

  .theme-toggle{
    position:fixed;
    right:18px;
    top:14px;
    z-index:20;
    display:inline-flex;
    gap:4px;
    padding:4px;
    border:1px solid var(--line-strong);
    border-radius:999px;
    background:color-mix(in srgb,var(--paper) 92%,transparent);
    box-shadow:var(--shadow);
    backdrop-filter:blur(12px);
  }
  .theme-toggle button{
    min-width:58px;
    min-height:36px;
    border:0;
    border-radius:999px;
    padding:7px 12px;
    background:transparent;
    color:var(--ink-faint);
    cursor:pointer;
    font:700 12px/1 "Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    transition:background .2s ease,color .2s ease,transform .2s ease;
  }
  .theme-toggle button:hover{color:var(--ink);transform:translateY(-1px);}
  .theme-toggle button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px;}
  .theme-toggle button[aria-pressed="true"]{background:var(--accent);color:#fff;}
  @media(max-width:640px){.theme-toggle{top:10px;right:10px;}}
  @media print{.theme-toggle{display:none;}}

  /* ---- Status header ---- */
  .status-card{
    display:block;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:28px 28px 24px;
    margin-bottom:28px;
  }
  .status-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .badge-pass{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--pass-bg);
    color:var(--pass);
    border:1px solid var(--pass-border);
    border-radius:999px;
    padding:8px 18px;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.02em;
  }
  .badge-pass svg{width:16px;height:16px;flex:none;}
  .round-note{
    text-align:right;
    font-size:13px;
    color:var(--ink-faint);
    line-height:1.5;
  }
  .round-note strong{color:var(--ink-soft);font-weight:600;}

  .status-title{
    margin:18px 0 4px;
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .status-sub{
    margin:0 0 18px;
    color:var(--ink-soft);
    font-size:14.5px;
  }
  .status-sub a{color:var(--accent);font-weight:750;text-underline-offset:3px;}

  .role-flow{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:stretch;
    gap:12px;
    margin:18px 0;
  }
  .role-box{
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    background:var(--accent-soft);
  }
  .role-box.evaluator{background:var(--table-head);}
  .role-box b{display:block;font-size:15px;margin-bottom:3px;}
  .role-box span{font-size:12px;color:var(--ink-faint);}
  .role-arrow{align-self:center;color:var(--accent);font-weight:900;font-size:20px;}

  .warning-summary{
    margin:4px 0 20px;
    padding:14px 16px;
    border:1px solid var(--warn-border);
    border-radius:12px;
    background:var(--warn-bg);
  }
  .warning-summary strong{display:block;color:var(--warn);font-size:13px;margin-bottom:5px;}
  .warning-summary p{margin:0;font-size:12.5px;line-height:1.6;}

  .score-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .score-pill{
    flex:1 1 150px;
    background:var(--accent-soft);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .score-pill .num{
    font-size:20px;
    font-weight:800;
    color:var(--accent);
  }
  .score-pill .label{
    font-size:12px;
    color:var(--ink-faint);
    margin-top:2px;
  }

  .timeline{
    display:flex;
    align-items:center;
    gap:0;
    margin:6px 0 20px;
    font-size:13px;
  }
  .tl-step{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tl-dot{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;flex:none;
    border:1px solid var(--line-strong);
    background:var(--paper);
    color:var(--ink-soft);
  }
  .tl-step.fail .tl-dot{
    background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn);
  }
  .tl-step.pass .tl-dot{
    background:var(--pass-bg);border-color:var(--pass-border);color:var(--pass);
  }
  .tl-text{color:var(--ink-soft);}
  .tl-text strong{color:var(--ink);}
  .tl-arrow{
    width:34px;height:1px;background:var(--line-strong);margin:0 6px;
  }

  .checklist{
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .checklist summary{
    cursor:pointer;
    list-style:none;
    padding:14px 16px;
    font-weight:700;
    font-size:14px;
    background:var(--table-head);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .checklist summary::-webkit-details-marker{display:none;}
  .checklist summary::after{
    content:"펼치기";
    font-size:12px;
    font-weight:600;
    color:var(--ink-faint);
  }
  .checklist[open] summary::after{content:"접기";}
  .check-grid{
    padding:6px 16px 14px;
  }
  .check-row{
    display:flex;
    gap:10px;
    padding:9px 2px;
    border-bottom:1px dashed var(--line);
    font-size:13.5px;
    align-items:flex-start;
  }
  .check-row:last-child{border-bottom:none;}
  .check-tag{
    flex:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-faint);
    width:28px;
    padding-top:1px;
  }
  .check-mark{
    flex:none;
    width:20px;
    text-align:center;
  }
  .check-mark.ok{color:var(--pass);font-weight:800;}
  .check-mark.fixed{color:var(--warn);font-weight:800;}
  .check-body{flex:1;color:var(--ink-soft);}
  .check-body b{color:var(--ink);font-weight:600;}
  .fixed-tag{
    display:inline-block;
    margin-left:6px;
    font-size:10.5px;
    font-weight:700;
    color:var(--warn);
    background:var(--warn-bg);
    border:1px solid var(--warn-border);
    border-radius:6px;
    padding:1px 6px;
    vertical-align:middle;
  }

  .diff-box{
    margin-top:18px;
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    background:var(--table-head);
  }
  .diff-box h4{
    margin:0 0 10px;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-faint);
  }
  .diff-item{
    margin-bottom:12px;
    font-size:13.5px;
  }
  .diff-item:last-child{margin-bottom:0;}
  .diff-loc{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px;
    color:var(--ink-faint);
    margin-bottom:4px;
  }
  .diff-before, .diff-after{
    padding:6px 10px;
    border-radius:6px;
    font-size:13px;
    line-height:1.6;
    margin-bottom:4px;
  }
  .diff-before{
    background:var(--warn-bg);
    color:var(--ink);
    border:1px solid var(--warn-border);
  }
  .diff-before::before{content:"수정 전  ";color:var(--warn);font-weight:700;}
  .diff-after{
    background:var(--pass-bg);
    color:var(--ink);
    border:1px solid var(--pass-border);
  }
  .diff-after::before{content:"수정 후  ";color:var(--pass);font-weight:700;}

  /* ---- Document body ---- */
  .doc{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:0 54px 54px;
  }
  @media (max-width:640px){
    .page{padding-top:68px;}
    .doc{padding:0 18px 32px;}
    .status-card{padding:20px 18px 18px;}
    .role-flow{grid-template-columns:1fr;}
    .role-arrow{transform:rotate(90deg);justify-self:center;}
  }

  .doc h1{
    font-size:32px;
    margin:0 0 22px;
    letter-spacing:-0.01em;
  }
  .doc h2{
    font-size:18px;
    margin:36px 0 14px;
    padding-bottom:8px;
    border-bottom:2px solid var(--accent);
    color:var(--ink);
  }
  .doc h2:first-of-type{margin-top:8px;}
  .doc h3{
    font-size:15px;
    margin:22px 0 10px;
    color:var(--accent);
  }
  .meta-list{
    list-style:none;
    margin:0 0 20px;
    padding:16px 18px;
    background:var(--accent-soft);
    border-radius:10px;
    font-size:13.5px;
    color:var(--ink-soft);
  }

  .doc-switch{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin:0 -54px;
    padding:16px 54px;
    border-bottom:1px solid var(--line);
    color:var(--ink-soft);
    font-size:13px;
  }
  .doc-switch strong{color:var(--accent);}
  .doc-switch a{
    color:var(--accent);
    font-weight:750;
    text-decoration:none;
    border-bottom:1px solid currentColor;
  }
  .proposal-hero{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(360px,.9fr);
    align-items:center;
    gap:36px;
    margin:22px 0 40px;
    padding:38px 34px 30px;
    background:linear-gradient(135deg,var(--hero-bg) 0%,var(--accent-soft) 100%);
    border:1px solid var(--hero-border);
    border-radius:22px;
  }
  .proposal-hero .kicker{margin:0 0 10px;color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.04em;}
  .proposal-hero h1{margin:0 0 12px;font-size:38px;line-height:1.22;letter-spacing:-.04em;}
  .proposal-hero p{max-width:48ch;margin:0;color:var(--hero-text);}
  .product-frame{overflow:hidden;border:1px solid var(--product-border);border-radius:18px;background:var(--product-bg);box-shadow:0 18px 42px rgba(45,91,103,.12);}
  .product-frame img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;}
  .hero-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:24px;border-top:1px solid var(--hero-line);border-bottom:1px solid var(--hero-line);}
  .hero-stat{padding:14px 10px 14px 0;}
  .hero-stat + .hero-stat{padding-left:14px;border-left:1px solid var(--hero-line);}
  .hero-stat b{display:block;color:var(--hero-stat);font-size:20px;line-height:1.1;}
  .hero-stat span{display:block;margin-top:5px;color:var(--hero-muted);font-size:11px;}
  .meta-list li{margin:3px 0;}
  .meta-list b{color:var(--ink);}

  hr{
    border:none;
    border-top:1px solid var(--line);
    margin:28px 0;
  }
  p{margin:0 0 12px;font-size:14.5px;color:var(--ink-soft);}
  p.warning{
    padding:10px 12px;
    border-left:3px solid var(--warn-border);
    background:var(--warn-bg);
    color:var(--ink-soft);
    font-size:13px;
  }
  p.warning b{color:var(--warn);}
  ul, ol{margin:0 0 14px;padding-left:22px;font-size:14.5px;color:var(--ink-soft);}
  li{margin:4px 0;}
  strong{color:var(--ink);font-weight:700;}
  b{color:var(--ink);}

  .table-wrap{
    overflow-x:auto;
    margin:14px 0 18px;
    border:1px solid var(--line);
    border-radius:10px;
  }
  table{
    border-collapse:separate;
    border-spacing:0;
    width:100%;
    font-size:13px;
    min-width:520px;
  }
  thead th{
    background:var(--table-head);
    color:var(--ink);
    font-weight:700;
    text-align:left;
    padding:13px 14px;
    white-space:nowrap;
    border-bottom:1px solid var(--line-strong);
  }
  tbody td{
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    color:var(--ink-soft);
    white-space:nowrap;
  }
  thead th + th, tbody td + td{border-left:1px solid var(--line);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:nth-child(even){background:var(--table-stripe);}
  tbody tr:last-child, tbody tr.total-row{
    font-weight:700;
    color:var(--ink);
  }
  tbody tr:last-child td{color:var(--ink);}

  .callout{
    background:var(--accent-soft);
    border-left:3px solid var(--accent);
    border-radius:0 8px 8px 0;
    padding:12px 16px;
    margin:14px 0;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .callout b{color:var(--ink);}

  .revision{
    margin-top:8px;
    background:var(--warn-bg);
    border:1px solid var(--warn-border);
    border-radius:10px;
    padding:14px 18px;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .revision b{color:var(--warn);}

  .footer-note{
    text-align:center;
    color:var(--ink-faint);
    font-size:12px;
    margin-top:28px;
  }
  @media (max-width:760px){
    .doc-switch{margin:0 -18px;padding:14px 18px;align-items:flex-start;flex-direction:column;gap:6px;}
    .proposal-hero{grid-template-columns:1fr;margin:18px 0 30px;padding:30px 18px 26px;}
    .proposal-hero h1{font-size:30px;}
    .product-frame{order:-1;}
    .hero-stats{grid-template-columns:1fr 1fr 1fr;}
    .hero-stat b{font-size:17px;}
  }
.reference-hero{grid-template-columns:1fr}
</style>
</head>
<body>
<!-- 디자인 스타일과 문서 간 이동을 위한 참고 파일. 실제 섹션·표·카드 수와 내용은 최종 Markdown에 맞춘다. -->
<div class="theme-toggle" role="group" aria-label="테마 선택">
  <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
  <button type="button" data-theme-choice="dark" aria-pressed="true">Dark</button>
</div>
<div class="page">
  <article class="doc">
    <nav class="doc-switch" aria-label="문서 이동">
      <strong aria-current="page">제안서</strong>
      <a href="cross-review-report.html">교차 검토 보고서 보기</a>
    </nav>
    <header class="proposal-hero reference-hero">
      <div>
        <p class="kicker">제안서 · 디자인 스타일</p>
        <h1>[문서 제목]</h1>
        <p>[문서 소개]</p>
        <div class="hero-stats">
          <div class="hero-stat"><b>[값]</b><span>[핵심 항목]</span></div>
          <div class="hero-stat"><b>[값]</b><span>[핵심 항목]</span></div>
        </div>
      </div>
    </header>
    <h2>[섹션 제목]</h2>
    <p>[본문]</p>
    <h3>[소제목]</h3>
    <ul><li>[주요 내용]</li><li>[주요 내용]</li></ul>
    <h2>[표 제목]</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th scope="col">[항목]</th><th scope="col">[내용]</th><th scope="col">[값]</th></tr></thead>
        <tbody><tr><td>[항목]</td><td>[내용]</td><td>[값]</td></tr>
        <tr class="total-row"><td>[합계 항목]</td><td>[내용]</td><td>[합계]</td></tr></tbody>
      </table>
    </div>
    <div class="callout"><b>[강조 제목]</b><p>[강조 내용]</p></div>
    <footer class="footer-note">[문서 하단 정보]</footer>
  </article>
</div>
<script>
  (() => {
    const root = document.documentElement;
    const buttons = [...document.querySelectorAll('[data-theme-choice]')];
    const applyTheme = (theme) => {
      const next = theme === 'light' ? 'light' : 'dark';
      root.dataset.theme = next;
      buttons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.themeChoice === next)));
    };
    applyTheme('dark');
    buttons.forEach((button) => button.addEventListener('click', () => applyTheme(button.dataset.themeChoice)));
  })();
</script>
</body>
</html>
